version: 2

models:
  - name: mart_sales
    description: >
      One row per delivered order, containing only the fields needed for
      the revenue dashboard: customer identity, order revenue, and purchase year.
    config:
      contract:
        enforced: true
      meta:
        owner: "data-analytics"
        domain: "sales"
        tags: ["mart", "sales"]
        metrics:
          total_revenue:
            label: Total Revenue
            type: sum
            sql: total_order_value
            format: '$#,##0'
            description: "Revenue from delivered orders."

          revenue_per_customer:
            label: Revenue Per Customer
            type: number
            sql: ${total_revenue} / nullif(${total_customers}, 0)
            format: '$#,##0.00'
            description: "Revenue divided by distinct customers."

          total_customers:
            label: Total Customers
            type: count_distinct
            sql: customer_id
            description: "Distinct customers with delivered orders."

    columns:
      - name: order_id
        data_type: string
        description: "Unique identifier for each delivered order."
        tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id

      - name: customer_id
        data_type: string
        description: "Customer identifier for the delivered order."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_id

      - name: total_order_value
        data_type: float64
        description: "Total value of the delivered order."
        tests:
          - not_null

      - name: month
        data_type: int64
        description: "Calendar month in which the order was purchased."
        tests:
          - not_null

      - name: year
        data_type: int64
        description: "Calendar year in which the order was purchased."
        tests:
          - not_null
